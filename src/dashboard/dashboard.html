<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>京东搬运助手 · 任务面板</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <header class="topbar">
    <h1>京东搬运助手</h1>
    <div id="runState" class="run-state">空闲</div>
  </header>

  <section class="toolbar">
    <button id="btnAdd" class="primary">添加链接</button>
    <button id="btnShop">抓取店铺</button>
    <button id="btnUpload" title="上传上架表（有“参考链接”列）：匹配采集记录，生成发布前检查表；上传改好的发布前检查表：保存修改并发布齐全的商品">上传表格</button>
    <button id="btnListingTemplate" title="下载固定的上架表模板：参考链接必填，市场价/京东价/采购价/协议价/条形码等选填；填好后点“上传表格”">下载上架表模板</button>
    <span class="sep"></span>
    <button id="btnCollect">采集选中</button>
    <button id="btnRecollect" title="把勾选的已采集商品重新采集一遍，覆盖商品信息和图片（编辑内容保留）">重新采集选中</button>
    <button id="btnVcImport" title="用 Excel/CSV 表格批量填写 VC 自营的市场价、京东价、采购价、采购员ERP、销售员ERP（按商品链接对应）">表格导入价格/ERP</button>
    <button id="btnPublish" title="先打开发布前检查：按上架模板列出每个商品要填的内容，补齐、选模板或用表格批量填写后再发布">发布选中</button>
    <button id="btnStop" disabled>停止</button>
    <span class="sep"></span>
    <button id="btnDelete">删除选中</button>
    <button id="btnSaveLocal" title="把已采集商品的图片和信息保存到存储位置：品牌/SKU/">保存到本地</button>
    <button id="btnExport">导出采集数据</button>
    <button id="btnExportXlsx" title="把当前列表勾选的已采集商品下载为 Excel 表格">导出采集数据为表格</button>
    <button id="btnImport">导入</button>
    <input id="importFile" type="file" accept="application/json,.json" hidden />
    <button id="btnSettings">设置</button>
    <button id="btnStorage">存储位置：未设置</button>
    <span class="sep"></span>
    <button id="btnMaster" title="发布成功的商品写进这个文件夹里的 上架总表.xlsx（一般选项目根目录）">上架总表：未设置</button>
    <label class="filter">筛选
      <select id="filter">
        <option value="all">全部</option>
        <option value="pending">待采集</option>
        <option value="collected">已采集</option>
        <option value="need_action">需处理</option>
        <option value="failed">失败</option>
      </select>
    </label>
    <button id="expandAllBrands" disabled>展开全部品牌</button>
    <button id="collapseAllBrands" disabled>折叠全部品牌</button>
    <span id="summary" class="muted"></span>
  </section>

  <p id="pauseBanner" class="banner" hidden></p>
  <p id="uploadStatus" class="banner" role="status" hidden></p>
  <div id="batchBar" class="banner batch-bar" hidden></div>

  <main>
    <table id="itemsTable" class="items">
      <thead>
        <tr>
          <th class="col-check"><input type="checkbox" id="checkAll" aria-label="全选当前筛选结果" disabled /></th>
          <th class="col-img">主图</th>
          <th>商品</th>
          <th class="col-price">价格</th>
          <th class="col-cat">类目</th>
          <th class="col-status">状态</th>
          <th class="col-ops">操作</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" class="empty" hidden>还没有任务。点击“添加链接”粘贴京东商品链接，点击“抓取店铺”填写店铺链接，或在商品页点击“搬运此商品”。</p>
  </main>

  <section class="log-panel">
    <div class="log-head"><strong>运行日志</strong><button id="btnClearLog" class="link">清空</button></div>
    <pre id="log"></pre>
  </section>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
